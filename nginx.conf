server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React/Vite SPA routing fix
    location / {
        try_files $uri /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}